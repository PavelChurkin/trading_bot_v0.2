<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070a12">
  <meta name="color-scheme" content="dark">
  <title>Орбита · сканер MOEX</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <!-- Вход по ключу -->
  <section id="login" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="off">
      <div class="logo"><span class="orb"></span>Орбита</div>
      <p class="muted">Сканер акций MOEX · вход по ключу доступа</p>
      <input id="login-key" type="password" placeholder="Ключ доступа" required autofocus>
      <button type="submit" class="primary">Войти</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </section>

  <!-- Приложение -->
  <div id="app" hidden>
    <header class="top">
      <div class="logo"><span class="orb"></span>Орбита</div>
      <nav id="nav">
        <a href="#market" data-view="market">Рынок</a>
        <a href="#signals" data-view="signals">Сигналы</a>
        <a href="#report" data-view="report">Отчёт дня</a>
        <a href="#silent" data-view="silent">Почему молчит</a>
        <a href="#paper" data-view="paper">Paper</a>
        <a href="#metrics" data-view="metrics">Метрики</a>
        <a href="#settings" data-view="settings">Настройки</a>
        <a href="#admin" data-view="admin" class="admin-only" hidden>Админ</a>
      </nav>
      <div class="who"><span id="who"></span><button id="logout" class="ghost small">Выйти</button></div>
    </header>
    <div id="statusbar" class="statusbar"></div>
    <main id="view"></main>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/static/charts.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
